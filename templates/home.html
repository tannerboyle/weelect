{% extends "base.html" %}{% block body %}
<h1>Who represents me?</h1>
<p>Enter your US street address to see your federal and state representatives.</p>
<form class="search" action="/lookup"><input name="address" placeholder="e.g. 1600 Pennsylvania Ave NW, Washington, DC 20500" required autofocus><button>Find</button></form>
<p style="font-size:.85rem;color:#666">Your address is sent to the U.S. Census geocoder to find districts; this prototype does not store it.</p>
{% endblock %}
