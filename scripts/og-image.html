<!doctype html><html><head><meta charset="utf-8"><style>
/* Source for static/og-default.png (1200x630). Regenerate:
   google-chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=static/og-default.png file://$PWD/scripts/og-image.html */
@font-face{font-family:"Playfair Display";font-weight:700;src:url(../static/fonts/playfair-display-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Playfair Display";font-weight:700;font-style:italic;src:url(../static/fonts/playfair-display-latin-700-italic.woff2) format("woff2")}
@font-face{font-family:"Source Serif 4";font-weight:400;src:url(../static/fonts/source-serif-4-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Source Serif 4";font-weight:400;font-style:italic;src:url(../static/fonts/source-serif-4-latin-400-italic.woff2) format("woff2")}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#f7f3e8;color:#15171c;font-family:"Source Serif 4",Georgia,serif;position:relative;overflow:hidden}
.stripe{height:14px;background:linear-gradient(90deg,#9b2335 0 33.3%,#f7f3e8 33.3% 66.6%,#1f2f5a 66.6%);border-bottom:2px solid #15171c}
.top{display:flex;justify-content:space-between;margin:26px 64px 0;padding-bottom:10px;border-bottom:1px solid #cfc8b4;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:#5d5f66}
.brand{display:flex;align-items:center;gap:26px;margin:44px 64px 0}
.brand img{width:120px;height:120px}
.brand span{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:104px;line-height:1}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:70px;line-height:1.1;margin:38px 64px 0}
p{font-style:italic;font-size:32px;line-height:1.35;color:#34363c;margin:18px 64px 0;max-width:1000px}
.foot{position:absolute;left:64px;right:64px;bottom:34px;display:flex;justify-content:space-between;border-top:2px solid #15171c;padding-top:12px;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#5d5f66}
.stars{color:#9b2335}
</style></head><body>
<div class="stripe"></div>
<div class="top"><span>Nonpartisan civic information</span><span class="stars">★ ★ ★ ★ ★</span></div>
<div class="brand"><img src="../static/logo-mark.svg" alt=""><span>We Elect</span></div>
<h1>Who represents you?</h1>
<p>Your officials, their votes, and the strongest case on both sides.</p>
<div class="foot"><span>weelect.org</span><span>Free · No ads · No accounts</span></div>
</body></html>
